<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DENTARA</title>
<!-- الاسم الذي يظهر تحديدًا عند "Add to Home Screen" على آيفون -->
<meta name="apple-mobile-web-app-title" content="DENTARA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1565C0">
<link rel="manifest" href="manifest.json">
<!-- أيقونات المتصفح وشاشة الهاتف الرئيسية بكل الأحجام المطلوبة -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=26">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';document.head.appendChild(s);"></script>
</head>
<body>

<!-- ======== شاشات التعريف (أول فتح فقط، بأسلوب صفحة البداية) ======== -->
<div id="onboardPage" class="page hidden">
    <div class="splash-wrap" id="onboardWrap">
        <div class="splash-frame">
            <div class="ob-img-hit" id="onboardImgWrap">
                <img id="onboardImg" src="" alt="">
                <button class="ob-hit-btn" id="onboardHitBtn" onclick="onboardNext()" aria-label="Next"></button>
            </div>
        </div>
        <div class="ob-dots info-dots ob-dots-top" id="onboardDots"></div>
    </div>
</div>

<!-- ======== عرض صورة معلوماتية (من نحن / طريقة الاستخدام) ======== -->
<div id="infoImagePage" class="page hidden">
    <div class="splash-wrap" id="infoImageWrap">
        <div class="splash-frame">
            <img id="infoImageImg" src="" alt="">
        </div>
        <button class="splash-back" onclick="goHome()" aria-label="Back">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <button class="info-nav info-nav-prev hidden" id="infoImagePrevBtn" onclick="infoImagePrev()" aria-label="Previous">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button class="info-nav info-nav-next hidden" id="infoImageNextBtn" onclick="infoImageNext()" aria-label="Next">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
        <div class="ob-dots info-dots hidden" id="infoImageDots"></div>
    </div>
</div>

<!-- ======== شاشة البداية ======== -->
<div id="splashPage" class="page">
    <div class="splash-wrap">
        <!-- الصورة كاملة كما صُمِّمت، بلا أي عنصر إضافي فوقها (شارة EN جزء
             من التصميم نفسه، زخرفية فقط). النقر في أي مكان يبدأ التطبيق أو
             يرجع للرئيسية (إن كانت مفتوحة كـ"من نحن" من داخل التطبيق) —
             وتبديل اللغة متاح من الشريط العلوي بعد الدخول -->
        <div class="splash-frame" onclick="handleSplashClick()">
            <img src="splash.png" alt="DENTARA - AI Personalized Oral Hygiene System, University of Basrah, College of Dentistry">
        </div>
        <button class="splash-back hidden" id="splashBackBtn" onclick="event.stopPropagation(); goHome();" aria-label="Back">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
</div>

<!-- ======== تسجيل الدخول ======== -->
<div id="loginPage" class="page hidden">
    <div class="auth-wrap">
        <div class="auth-brand">
            <i class="fa-solid fa-tooth"></i>
            <b>DENTARA</b>
        </div>
        <div class="form-card auth-card">
            <h3 data-t="loginTitle"></h3>
            <div class="form-group"><label data-t="username"></label>
                <input id="li_username" dir="ltr" autocomplete="username"></div>
            <div class="form-group"><label data-t="password"></label>
                <input id="li_password" type="password" dir="ltr" autocomplete="current-password"></div>
            <button class="btn-primary" id="loginBtn" onclick="submitLogin()" data-t="loginBtn"></button>
            <button class="btn-ghost auth-switch" onclick="showRegisterForm()" data-t="newDoctorLink"></button>
            <p class="dev-credit">Developed by Hussein Mahmoud Shaker</p>
        </div>
    </div>
</div>

<!-- ======== تسجيل طبيب جديد ======== -->
<div id="registerPage" class="page hidden">
    <div class="auth-wrap">
        <div class="auth-brand">
            <i class="fa-solid fa-tooth"></i>
            <b>DENTARA</b>
        </div>
        <div class="form-card auth-card">
            <h3 data-t="registerTitle"></h3>
            <div class="form-group"><label data-t="doctorName"></label>
                <input id="rg_name" autocomplete="name"></div>
            <div class="form-group"><label data-t="username"></label>
                <input id="rg_username" dir="ltr" autocomplete="username"></div>
            <div class="form-group"><label data-t="password"></label>
                <input id="rg_password" type="password" dir="ltr" autocomplete="new-password"></div>
            <div class="form-group"><label data-t="inviteCode"></label>
                <input id="rg_invite" dir="ltr">
                <small data-t="inviteCodeHint"></small></div>
            <button class="btn-primary" id="registerBtn" onclick="submitRegister()" data-t="registerBtn"></button>
            <button class="btn-ghost auth-switch" onclick="showLoginForm()" data-t="haveAccountLink"></button>
            <p class="dev-credit">Developed by Hussein Mahmoud Shaker</p>
        </div>
    </div>
</div>

<!-- ======== لوحة المدير ======== -->
<div id="adminPage" class="page hidden">
    <header class="app-header brand-header">
        <button class="header-btn" onclick="goHome()"><i class="fa-solid fa-arrow-right"></i></button>
        <h2 data-t="adminPanel"></h2>
        <span></span>
    </header>
    <div class="container">
        <p class="modal-note" data-t="adminIntro"></p>
        <div id="adminBody"></div>
    </div>
</div>

<!-- ======== مركز المعرفة (إحصائيات مجمَّعة من كل التقييمات) ======== -->
<!-- ======== الشات بوت المتخصص بطب الأسنان ======== -->
<div id="chatPage" class="page hidden">
    <header class="app-header brand-header">
        <button class="header-btn" onclick="goHome()"><i class="fa-solid fa-arrow-right"></i></button>
        <h2 data-t="dentalAssistant"></h2>
        <button class="header-btn" onclick="clearChat()" aria-label="Clear"><i class="fa-solid fa-broom"></i></button>
    </header>
    <div class="chat-wrap">
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-row">
            <textarea id="chatInput" class="chat-input" rows="1" data-tp="chatPlaceholder" onkeydown="chatKeydown(event)"></textarea>
            <button id="chatSendBtn" class="chat-send-btn" onclick="sendChatMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<div id="insightsPage" class="page hidden">
    <header class="app-header brand-header">
        <button class="header-btn" onclick="goHome()"><i class="fa-solid fa-arrow-right"></i></button>
        <h2 data-t="knowledgeCenter"></h2>
        <span></span>
    </header>
    <div class="container">
        <div id="insightsBody"></div>
    </div>
</div>

<!-- ======== الصفحة الرئيسية ======== -->
<div id="homePage" class="page hidden">
    <!-- رأس مُوحَّد بألوان شاشة البداية نفسها: يحمل الهوية (DENTARA)
         وأزرار التحكم (اللغة، الدليل) معًا في شريط واحد أعلى الصفحة -->
    <header class="app-header brand-header">
        <div class="brand-header-id">
            <i class="fa-solid fa-tooth"></i>
            <div>
                <b>DENTARA</b>
                <span data-t="tagline"></span>
            </div>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="toggleLang()" id="langBtn">ع</button>
            <button class="header-btn" onclick="showInfoImage(['how-it-works-1.jpg', 'how-it-works-2.jpg'])" aria-label="How to use"><i class="fa-solid fa-circle-question"></i></button>
            <button class="header-btn" onclick="showInfoImage('about-dentara.png')" aria-label="About"><i class="fa-solid fa-circle-info"></i></button>
            <button class="header-btn" onclick="doLogout()" aria-label="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </header>

    <div class="container">
        <div class="welcome-row">
            <p class="welcome"><span data-t="welcome"></span> <b id="welcomeDoctorName"></b></p>
            <button class="bell-btn" onclick="showReminders()" aria-label="Reminders">
                <i class="fa-solid fa-bell"></i>
                <span class="bell-dot hidden" id="bellDot"></span>
            </button>
        </div>

        <div class="home-grid">
            <div class="home-card primary" onclick="startNewAssessment()">
                <i class="fa-solid fa-user-plus"></i>
                <b data-t="newPatient"></b>
                <span data-t="newPatientD"></span>
            </div>
            <div class="home-card" onclick="showPatients()">
                <i class="fa-solid fa-folder-open"></i>
                <b data-t="prevPatients"></b>
                <span id="homeCount"></span>
            </div>
            <div class="home-card" onclick="showSettings('questions')">
                <i class="fa-solid fa-clipboard-question"></i>
                <b data-t="questionsNav"></b>
                <span id="homeQCount"></span>
            </div>
            <div class="home-card" onclick="showSettings('videos')">
                <i class="fa-solid fa-video"></i>
                <b data-t="videosNav"></b>
                <span id="homeVCount"></span>
            </div>
            <div class="home-card" onclick="openInstallGuide()">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <b data-t="installApp"></b>
                <span data-t="installAppD"></span>
            </div>
            <div class="home-card" onclick="openChat()">
                <i class="fa-solid fa-comment-medical"></i>
                <b data-t="dentalAssistant"></b>
                <span data-t="dentalAssistantD"></span>
            </div>
            <div class="home-card" onclick="showInsights()">
                <i class="fa-solid fa-chart-pie"></i>
                <b data-t="knowledgeCenter"></b>
                <span data-t="knowledgeCenterCardD"></span>
            </div>
            <div class="home-card hidden" id="adminCard" onclick="showAdminPanel()">
                <i class="fa-solid fa-user-shield"></i>
                <b data-t="adminPanel"></b>
                <span data-t="adminPanelD"></span>
            </div>
        </div>

        <p class="dev-credit">Developed by Hussein Mahmoud Shaker</p>
    </div>
</div>

<!-- ======== بيانات المريض ======== -->
<div id="patientInfoPage" class="page hidden">
    <header class="app-header brand-header">
        <button class="header-btn" onclick="goHome()"><i class="fa-solid fa-arrow-right"></i></button>
        <h2 data-t="patientInfo"></h2>
        <span></span>
    </header>

    <div class="container narrow">
        <div class="form-card">
            <h3><i class="fa-solid fa-user"></i> <span data-t="basicInfo"></span></h3>
            <div class="form-group"><label data-t="fullName"></label><input id="pi_name" data-tp="fullNameP"></div>
            <div class="form-group"><label data-t="age"></label><input id="pi_age" type="number" min="1" max="120" placeholder="34"></div>
            <div class="form-group"><label data-t="sex"></label>
                <select id="pi_gender">
                    <option value="" data-t="choose"></option>
                    <option value="Male" data-t="male"></option>
                    <option value="Female" data-t="female"></option>
                </select>
            </div>
            <button class="btn-primary" onclick="submitPatientInfo()">
                <span data-t="startQ"></span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>
</div>

<!-- ======== الاستبيان ======== -->
<div id="wizardPage" class="page hidden">
    <header class="app-header brand-header">
        <button class="header-btn" onclick="confirmExitWizard()"><i class="fa-solid fa-xmark"></i></button>
        <h2 id="wizardStepLabel"></h2>
        <span id="wizardPercent" class="percent">0%</span>
    </header>

    <div class="progress-track"><div id="wizardProgressBar" class="progress-fill"></div></div>

    <div class="container">
        <div id="wizardBody"></div>
    </div>

    <div class="wizard-nav">
        <button id="wizardBackBtn" class="btn-ghost" onclick="wizardBack()"></button>
        <button id="wizardNextBtn" class="btn-primary" onclick="wizardNextOrFinish()"></button>
    </div>
</div>

<!-- ======== المعالجة ======== -->
<div id="processingPage" class="page hidden">
    <div class="processing">
        <div class="ai-orb"><i class="fa-solid fa-robot"></i></div>
        <h2 id="processingTitle"></h2>
        <p data-t="analyzingD"></p>
        <div class="spinner"></div>
        <span class="processing-note" data-t="pleaseWait"></span>
    </div>
</div>

<!-- ======== النتائج ======== -->
<div id="resultsPage" class="page hidden">
    <header class="app-header brand-header">
        <button class="header-btn" onclick="goHome()"><i class="fa-solid fa-house"></i></button>
        <h2 data-t="results"></h2>
        <span></span>
    </header>

    <div class="container">
        <div id="resultsBody"></div>
        <div class="result-actions" id="resultActions">
            <button class="btn-ghost" id="editResultsBtn" onclick="openResultEditor()"><i class="fa-solid fa-pen-to-square"></i> <span data-t="editResults"></span></button>
            <button class="btn-ghost" id="reanalyzeBtn" onclick="reanalyzeCurrent()"><i class="fa-solid fa-rotate"></i> <span data-t="reanalyze"></span></button>
            <button class="btn-primary" onclick="buildBooklet()"><i class="fa-solid fa-book"></i> <span data-t="openBooklet"></span></button>
            <button class="btn-ghost" onclick="startNewAssessment()"><i class="fa-solid fa-plus"></i> <span data-t="anotherOne"></span></button>
        </div>
    </div>
</div>

<!-- ======== دفتر المريض ======== -->
<div id="bookletPage" class="page hidden">
    <header class="app-header brand-header no-print">
        <button class="header-btn" onclick="showPage('resultsPage')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2 data-t="booklet"></h2>
        <button class="header-btn" onclick="printBooklet()"><i class="fa-solid fa-print"></i></button>
    </header>
    <p class="print-hint no-print"><i class="fa-solid fa-circle-info"></i> <span data-t="bookletHint"></span></p>
    <div id="bookletArea"></div>
    <div class="result-actions no-print">
        <button class="btn-ghost hidden" id="editBookletBtn" onclick="editBookletTasks()"><i class="fa-solid fa-pen-to-square"></i> <span data-t="editBooklet"></span></button>
        <button class="btn-primary" onclick="printBooklet()"><i class="fa-solid fa-print"></i> <span data-t="print"></span></button>
    </div>
</div>

<!-- ======== شاشة اكتمال التقييم + ملخص القسم ======== -->
<div id="completePage" class="page hidden">
    <header class="app-header brand-header">
        <button class="header-btn" onclick="goHome()"><i class="fa-solid fa-arrow-right"></i></button>
        <h2 data-t="assessmentCompleteTitle"></h2>
        <button class="header-btn" onclick="exportAllToWord()" aria-label="Export Data"><i class="fa-solid fa-download"></i></button>
    </header>
    <div class="container">
        <div id="completeBody"></div>
        <button class="btn-primary cs-start-btn" onclick="startNewAssessment()">
            <i class="fa-solid fa-plus"></i> <span data-t="anotherOne"></span>
        </button>
        <p class="cs-secure"><i class="fa-solid fa-lock"></i> <span data-t="dataSecureNote"></span></p>
    </div>
</div>

<!-- ======== سجل المرضى ======== -->
<!-- ======== تذكيرات مواعيد المتابعة ======== -->
<div id="remindersPage" class="page hidden">
    <header class="app-header brand-header">
        <button class="header-btn" onclick="goHome()"><i class="fa-solid fa-arrow-right"></i></button>
        <h2 data-t="reminders"></h2>
        <span></span>
    </header>

    <div class="container">
        <div class="fu-tabs" id="reminderFilterTabs"></div>
        <div id="remindersList"></div>
    </div>
</div>

<div id="patientsPage" class="page hidden">
    <header class="app-header brand-header">
        <button class="header-btn" onclick="goHome()"><i class="fa-solid fa-arrow-right"></i></button>
        <h2 data-t="prevPatients"></h2>
        <span></span>
    </header>

    <div class="container">
        <button class="btn-ghost export-btn" onclick="exportAllToWord()">
            <i class="fa-solid fa-file-word"></i> <span data-t="exportWord"></span>
        </button>
        <input class="search-box" id="ptSearch" data-tp="searchP"
               oninput="renderPatientsList(this.value)">
        <div class="fu-tabs" id="patientFilterTabs"></div>
        <div id="patientsList"></div>
    </div>
</div>

<!-- ======== الإعدادات ======== -->
<div id="settingsPage" class="page hidden">
    <header class="app-header brand-header">
        <button class="header-btn" onclick="goHome()"><i class="fa-solid fa-arrow-right"></i></button>
        <h2 data-t="settings"></h2>
        <span></span>
    </header>

    <div class="container">
        <div class="tabs" id="settingsTabs">
            <button data-tab="questions" onclick="showSettings('questions')"><i class="fa-solid fa-clipboard-question"></i> <span data-t="questionsNav"></span></button>
            <button data-tab="videos" onclick="showSettings('videos')"><i class="fa-solid fa-video"></i> <span data-t="videosNav"></span></button>
            <button data-tab="booklet" onclick="showSettings('booklet')"><i class="fa-solid fa-book"></i> <span data-t="bookletTemplateNav"></span></button>
        </div>
        <div id="settingsBody"></div>
    </div>
</div>

<!-- ======== صفحة المريض العامة (عبر QR) ======== -->
<div id="patientViewPage" class="page hidden">
    <div class="pv-wrap"><div id="pvBody"></div></div>
</div>

<!-- ======== النوافذ المشتركة ======== -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <span class="close-modal" id="modalCloseBtn">&times;</span>
        <h3 id="modalTitle"></h3>
        <div id="modalBody"></div>
        <button id="modalSaveBtn" class="btn-primary"></button>
    </div>
</div>

<div id="confirmModal" class="modal hidden">
    <div class="modal-content small">
        <h3 id="confirmTitle"></h3>
        <p id="confirmMessage"></p>
        <div class="confirm-actions">
            <button id="confirmYesBtn" class="btn-danger" data-t="yes"></button>
            <button id="confirmNoBtn" class="btn-ghost" data-t="cancel"></button>
        </div>
    </div>
</div>

<div id="loadingOverlay" class="modal hidden">
    <div class="loading-box">
        <div class="spinner"></div>
        <p id="loadingText"></p>
    </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="i18n.js?v=26"></script>
<script src="auth.js?v=26"></script>
<script src="admin.js?v=26"></script>
<script src="install.js?v=26"></script>
<script src="insights.js?v=26"></script>
<script src="chat.js?v=26"></script>
<script src="onboarding.js?v=26"></script>
<script src="config.js?v=26"></script>
<script src="app.js?v=26"></script>
<script src="core.js?v=26"></script>
<script src="seed.js?v=26"></script>
<script src="assessment.js?v=26"></script>
<script src="ai.js?v=26"></script>
<script src="report.js?v=26"></script>
<script src="settings.js?v=26"></script>
<script src="patients.js?v=26"></script>
<script src="patientview.js?v=26"></script>
<script src="guide.js?v=26"></script>
<script src="editor.js?v=26"></script>
<script src="export.js?v=26"></script>
<script src="booklet.js?v=26"></script>
<script src="main.js?v=26"></script>
</body>
</html>
